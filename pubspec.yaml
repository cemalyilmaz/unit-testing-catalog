name: flutter_unit_testing_catalog
description: >
  A catalog of unit testing patterns for Flutter development,
  structured in the spirit of the Gang of Four Design Patterns book.
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.0
  fake_async: ^1.3.1
